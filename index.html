<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منافسات وفرص مرفان - نحو رؤية 2030</title>
<style>
:root{--navy:#0A1931;--gold:#C9A227;--gold-dark:#A67C00;--gold-light:#E6C87A;--green:#006C35}
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#;color:#fff}
.top-bar{height:8px;background:var(--green)}
header{background:var(--navy);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:20px}
button{cursor:pointer;border:1px solid var(--gold);background:transparent;color:#fff;padding:8px 16px;border-radius:8px}
.gold-btn,.filters.active{background:var(--gold);color:#0A1931;font-weight:700}
.banner{background:linear-gradient(rgba(10,25,49,.85),rgba(10,25,49,.85)),url('https://images.unsplash.com/photo-1578895101408-1a36b834dedb?w=1600');background-size:cover;padding:60px 20px;text-align:center}
.banner h1{color:var(--gold);font-size:34px;margin:0}.banner h1 span{color:#fff;font-size:20px}.banner p{color:#ddd}
.search{text-align:center;padding:20px}.search input{width:90%;max-width:600px;padding:12px;border-radius:10px;border:1px solid #ccc}
.filters{text-align:center;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:20px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.card{background:var(--navy);border:1px solid var(--gold);border-radius:14px;padding:20px;text-align:center}
.card h3{color:var(--gold)}.card p{color:#eee}.card.icon{font-size:34px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}.hidden{display:none}.modal-box{background:var(--navy);border:1px solid var(--gold);padding:24px;border-radius:14px;max-width:500px;width:90%;text-align:center}.lock{font-size:48px;color:var(--gold)}
</style>
</head>
<body>
<div class="top-bar"></div>
<header><div class="logo">مرفان | منافسات وفرص مرفان</div><div><button onclick="login()">دخول</button> <button class="gold-btn">اشتراك</button></div></header>
<div class="banner"><h1>منافسات وفرص مرفان <span>- نحو رؤية 2030</span></h1><p>بانوراما الرياض - المملكة والفيصلية</p></div>
<div class="search"><input id="search" placeholder="ابحث عن منافسة..." oninput="filter()"></div>
<div class="filters"><button class="active" onclick="setFilter('all',this)">الكل</button><button onclick="setFilter('tech',this)">تقنية</button><button onclick="setFilter('invest',this)">استثمارية</button><button onclick="setFilter('eng',this)">هندسية</button></div>
<div class="grid" id="grid"></div>
<div id="modal" class="modal hidden"><div class="modal-box"><div id="modal-content"></div><br><button onclick="closeModal()">إغلاق</button></div></div>
<script>
let isLogged=false;let currentFilter='all';
const data=[
{id:1,cat:'tech',icon:'💻',title:'المنافسات التقنية',desc:'5 منافسات تقنية',info:'جوائز تصل إلى 100,000 ريال',detail:'تفاصيل كاملة للمنافسة التقنية: الشروط، الملفات، طريقة التقديم، وآخر موعد.'},
{id:2,cat:'invest',icon:'💼',title:'الفرص الاستثمارية',desc:'8 فرص استثمارية',info:'تمويل حتى 500 ألف',detail:'تفاصيل كاملة للفرص الاستثمارية: حجم التمويل، الشروط، وطريقة التقديم.'},
{id:3,cat:'eng',icon:'🏅',title:'المنافسات الهندسية',desc:'12 فرصة مفتوحة',info:'مغلق بعد 5 أيام',detail:'تفاصيل كاملة للمنافسات الهندسية: نطاق العمل، الشروط، وآخر موعد.'}];
function render(){const q=(document.getElementById('search').value||'').toLowerCase();document.getElementById('grid').innerHTML=data.filter(d=>(currentFilter==='all'||d.cat===currentFilter)&&(d.title+d.desc).toLowerCase().includes(q)).map(d=>`<div class="card"><div class="icon">${d.icon}</div><h3>${d.title}</h3><p>${d.desc}</p><p>${d.info}</p><button class="gold-btn" onclick="openDetail(${d.id})">عرض التفاصيل</button></div>`).join('');}
function setFilter(f,el){currentFilter=f;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));el.classList.add('active');render()}
function filter(){render()}
function login(){const e=prompt('الايميل:');const p=prompt('كلمة السر:');if(e==='demo@munafasat.com'&&p==='Demo1234'){isLogged=true;alert('أهلا بك في منافسات وفرص مرفان');}else{alert('بيانات خاطئة، جرب الحساب التجريبي');}}
function openDetail(id){const d=data.find(x=>x.id===id);document.getElementById('modal').classList.remove('hidden');document.getElementById('modal-content').innerHTML=isLogged?`<h2>${d.title}</h2><p>${d.detail}</p>`:`<div class="lock">🔒</div><h2>${d.title}</h2><p>التفاصيل مغطاة بقفل ذهبي</p><p>اشترك أو ادخل بالحساب التجريبي لعرضها</p><button class="gold-btn" onclick="login()">دخول تجريبي</button>`}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
render();
</script>
</body>
</html>
